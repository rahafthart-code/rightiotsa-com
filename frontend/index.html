    <script>
window.smartAssetHandler = {
    checkGeofence: function(lat, lng) {
        const safeZone = { lat: 24.7136, lng: 46.6753, radius: 500 };
        const distance = Math.sqrt(Math.pow(lat - safeZone.lat, 2) + Math.pow(lng - safeZone.lng, 2));
        return distance > safeZone.radius ? "OUTSIDE_ALERT" : "SAFE";
    },
    processVitals: function(heartRate) {
        if (heartRate > 120) console.warn("High Heart Rate Detected!");
    }
};
console.log("Right InsurTech: IoT Logic Active");
